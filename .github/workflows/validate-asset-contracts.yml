name: Validate Asset Contracts

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'data/characters/**'
      - 'data/adapters/**'
      - 'tools/validate_asset_contracts.py'
      - 'tools/requirements-asset-validation.txt'
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'data/characters/**'
      - 'data/adapters/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-asset-validation.txt
      - run: python tools/validate_asset_contracts.py
